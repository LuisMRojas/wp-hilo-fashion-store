<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hilo — Tienda de ropa</title>
<meta name="description" content="Hilo — Tienda de ropa. Tema WordPress creado desde cero.">
<meta property="og:title" content="Hilo — Tienda de ropa">
<meta property="og:image" content="https://raw.githubusercontent.com/LuisMRojas/wp-hilo-fashion-store/main/screenshot.png">
<style>
html,body{margin:0;height:100%;background:#f6f2ec;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:#f6f2ec;color:#1c1a17;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .6s ease;z-index:2}
#loader.done{opacity:0;pointer-events:none}
#loader b{display:block;font:600 clamp(2.5rem,8vw,5rem)/1 Georgia,serif;letter-spacing:.02em;text-align:center}
#loader p{margin:1rem 0 0;opacity:.7;text-align:center;font-size:.95rem}
#bar{width:180px;height:3px;margin:1.5rem auto 0;background:rgba(128,128,128,.25);border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:40%;background:#b5532f;animation:l 1.2s ease-in-out infinite}
@keyframes l{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
a.code{position:fixed;right:14px;bottom:14px;z-index:3;padding:9px 14px;border-radius:999px;background:#111;color:#fff;font:600 12px/1 system-ui,sans-serif;text-decoration:none;opacity:.85}
a.code:hover{opacity:1}
</style>
</head>
<body>
<div id="loader"><div><b>Hilo</b><p>Abriendo la tienda… (instalando WooCommerce, unos segundos)</p><div id="bar"><i></i></div></div></div>
<iframe id="site" title="Hilo — Tienda de ropa" src="https://playground.wordpress.net/?mode=seamless&blueprint-url=https://raw.githubusercontent.com/LuisMRojas/wp-hilo-fashion-store/main/blueprint-site.json" allow="clipboard-write; fullscreen; autoplay; encrypted-media"></iframe>
<a class="code" href="https://github.com/LuisMRojas/wp-hilo-fashion-store" target="_blank" rel="noopener">⟨/⟩ Ver código</a>
<script>
var l=document.getElementById('loader');
document.getElementById('site').addEventListener('load',function(){setTimeout(function(){l.classList.add('done')},400)});
setTimeout(function(){l.classList.add('done')},15000);
</script>
</body>
</html>
